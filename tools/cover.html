<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<title>人情世故指南 · 封面</title>
<!-- 仓库根目录 og.png 的源文件：用浏览器按 1200×630、2 倍像素截取 #card 即可得到。README 封面和网页分享图都用这张 -->
<style>
  :root{--red:#b4232c;--red-2:#d4555c;--ink:#1d1d22;--gray:#5f6068;--line:#ececee}
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#fff}
  body{font-family:"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;color:var(--ink);-webkit-font-smoothing:antialiased}
  .card{position:relative;width:1200px;height:630px;overflow:hidden;background:#fff}
  /* 浅网格从左上往右下淡出，右上角一团淡红光 */
  .card::before{content:"";position:absolute;inset:0;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:36px 36px;-webkit-mask-image:linear-gradient(110deg,#000 8%,transparent 68%)}
  .card::after{content:"";position:absolute;right:-200px;top:-240px;width:800px;height:800px;border-radius:50%;background:radial-gradient(circle,rgba(212,85,92,.20),rgba(212,85,92,0) 66%)}
  .main{position:absolute;left:92px;top:112px;z-index:2}
  .title{display:flex;align-items:center;gap:20px;margin:0;font-size:96px;line-height:1.1;font-weight:800;letter-spacing:4px;white-space:nowrap}
  .title .logo{flex:none;width:72px;height:72px;border-radius:19px;background:linear-gradient(135deg,var(--red-2),var(--red));display:grid;place-items:center;box-shadow:0 10px 24px rgba(180,35,44,.25)}
  .title .logo svg{width:44px;height:44px}
  .slogan{margin:24px 0 0 4px;font-size:64px;line-height:1.2;font-weight:700;letter-spacing:3px;white-space:nowrap}
  .slogan em{font-style:normal;color:var(--red)}
  .bar{width:72px;height:6px;margin:30px 0 0 6px;border-radius:3px;background:var(--red)}
  .sub{margin:20px 0 0 6px;font-size:25px;line-height:1.5;color:var(--gray);font-weight:500;white-space:nowrap}
  .sub b{color:var(--ink);font-weight:700;margin-right:14px}
  .seal{position:absolute;right:96px;top:124px;width:224px;height:224px;z-index:2;transform:rotate(-6deg);border-radius:22px;background:var(--red);box-shadow:0 18px 40px rgba(180,35,44,.28);display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;padding:20px;align-items:center;justify-items:center;font-family:"Songti SC","STSong",serif;font-weight:900;color:#fff;font-size:74px;line-height:1}
  .seal::after{content:"";position:absolute;inset:10px;border:3px solid rgba(255,255,255,.85);border-radius:14px}
  .url{position:absolute;right:48px;top:384px;width:320px;text-align:center;white-space:nowrap;z-index:2;font-size:17px;color:var(--gray);letter-spacing:.3px}
  .chips{position:absolute;left:92px;right:92px;bottom:64px;display:flex;flex-wrap:nowrap;gap:10px;z-index:2}
  .chips span{font-size:19px;font-weight:600;color:var(--red);background:rgba(180,35,44,.07);border:1px solid rgba(180,35,44,.18);border-radius:999px;padding:6px 16px;white-space:nowrap}
</style>
</head>
<body>
<div class="card" id="card">
  <div class="main">
    <h1 class="title"><span class="logo" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M6 12.5l4 4 8-9.5" fill="none" stroke="#fff" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round"/></svg></span>人情世故指南</h1>
    <div class="slogan">讲清规则，也讲清<em>人心</em></div>
    <div class="bar"></div>
    <div class="sub"><b>31 章 · 640 条</b>每条写明规矩、做法、话术与红线</div>
  </div>
  <div class="seal" aria-hidden="true"><span>人</span><span>情</span><span>世</span><span>故</span></div>
  <div class="url">changxueyi.github.io/renqing-shigu</div>
  <div class="chips"><span>说话分寸</span><span>送礼随份子</span><span>饭局酒桌</span><span>亲戚与婚恋</span><span>职场与体制内</span><span>办事维权</span><span>识别 PUA 与诈骗</span></div>
</div>
</body>
</html>
